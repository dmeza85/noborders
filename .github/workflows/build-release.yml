name: Build and Create Release Asset

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore NoBorders.csproj

      - name: Publish project
        run: dotnet publish NoBorders.csproj --configuration Release --no-restore --output publish

      - name: Verify build output
        run: |
          if (!(Test-Path "publish\NoBorders.exe")) {
            Write-Error "Build failed: NoBorders.exe not found"
            Get-ChildItem -Recurse bin, publish -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            exit 1
          }

      - name: Create release package
        run: |
          mkdir release-package
          copy "publish\NoBorders.exe" "release-package\"
          copy "README.md" "release-package\"
          Compress-Archive -Path "release-package\*" -DestinationPath "NoBorders-${{ github.ref_name }}.zip"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: NoBorders-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}