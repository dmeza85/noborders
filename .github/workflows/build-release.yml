name: Build and Create Release Asset

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build project
        run: dotnet build --configuration Release --no-restore
      
      - name: Verify build output
        run: |
          if (!(Test-Path "bin\Release\net10.0-windows\NoBorders.exe")) {
            Write-Error "Build failed: NoBorders.exe not found"
            exit 1
          }
      
      - name: Create release package
        run: |
          mkdir release-package
          copy "bin\Release\net10.0-windows\NoBorders.exe" "release-package\"
          copy "README.md" "release-package\"
          Compress-Archive -Path "release-package\*" -DestinationPath "NoBorders-${{ github.ref_name }}.zip"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: NoBorders-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}